name: Build and Push Three Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  publish_images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-frontend:${{ github.sha }}

      - name: Build and Push Database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-database:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/my-webapp-database:${{ github.sha }}